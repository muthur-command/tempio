# After a tempio GitHub Release, open PRs in repos that pin TEMPIO_VERSION.
# Requires org/repo secret TEMPIO_DOWNSTREAM_BUMP_TOKEN (PAT or GitHub App token)
# with contents:write on docker-base, operating-system, and addons.
#
# Renovate (.github/renovate.json in those repos) is a backup on a 12h schedule.

name: Bump downstream tempio pins

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - docker-base
          - operating-system
          - addons
    steps:
      # secrets cannot be used in job/step `if:`; check in a run step instead.
      - name: Check downstream bump token
        id: token
        env:
          TEMPIO_DOWNSTREAM_BUMP_TOKEN: ${{ secrets.TEMPIO_DOWNSTREAM_BUMP_TOKEN }}
        run: |
          if [[ -z "${TEMPIO_DOWNSTREAM_BUMP_TOKEN}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::TEMPIO_DOWNSTREAM_BUMP_TOKEN is not set. Skipping downstream PRs for ${{ matrix.repo }}."
            echo "Configure a PAT with contents:write on docker-base, operating-system, and addons."
            echo "Renovate in those repos will still open PRs on its schedule if the Renovate app is enabled."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize release version
        if: steps.token.outputs.skip != 'true'
        id: version
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pin=${tag#mc_}" >> "$GITHUB_OUTPUT"

      - name: Checkout tempio (scripts)
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout ${{ matrix.repo }}
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: muthur-command/${{ matrix.repo }}
          ref: mc
          token: ${{ secrets.TEMPIO_DOWNSTREAM_BUMP_TOKEN }}
          path: consumer

      - name: Apply tempio pin bump
        if: steps.token.outputs.skip != 'true'
        run: |
          chmod +x ./scripts/bump-downstream-tempio-pin.sh
          ./scripts/bump-downstream-tempio-pin.sh \
            "${{ matrix.repo }}" \
            "${{ github.workspace }}/consumer" \
            "${{ steps.version.outputs.tag }}"

      - name: Create pull request
        if: steps.token.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@2f38cd26bfebe301a5ee90bdd6550a69dc3ef23f # v7.0.4
        with:
          token: ${{ secrets.TEMPIO_DOWNSTREAM_BUMP_TOKEN }}
          path: consumer
          branch: "bump/tempio-${{ steps.version.outputs.pin }}"
          delete-branch: true
          labels: dependencies
          title: "chore(deps): bump tempio to ${{ steps.version.outputs.pin }}"
          commit-message: "chore(deps): bump tempio to ${{ steps.version.outputs.pin }}"
          body: |
            Automated PR from [tempio](https://github.com/muthur-command/tempio) release `${{ steps.version.outputs.tag }}`.

            **You still need to (manual):**
            - Review and merge this PR
            - Publish a new release for `${{ matrix.repo }}` when appropriate
            - Rebuild downstream images (supervisor, plugins, docker, etc.) after docker-base is updated

            Also tracked by Renovate (`custom.regex` on `muthur-command/tempio` releases).
